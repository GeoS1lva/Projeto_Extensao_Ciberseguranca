<div class="pwgen">
  <div class="pwgen__output">
    <div class="pwgen__display">{{ password || 'Clique em gerar senha' }}</div>
    <div class="pwgen__actions">
      <button class="pwgen__btn pwgen__btn--copy" (click)="copy()">
        <i class="ti ti-copy" aria-hidden="true"></i>Copiar
      </button>
      <button class="pwgen__btn pwgen__btn--regen" (click)="generate()">
        <i class="ti ti-refresh" aria-hidden="true"></i>Gerar
      </button>
    </div>
  </div>

  <div class="pwgen__strength-row">
    <span class="pwgen__str-label">FORÇA</span>
    <div class="pwgen__str-bar-wrap">
      <div class="pwgen__str-bar" [style.width.%]="strength.percent" [style.background]="strength.color"></div>
    </div>
    <span class="pwgen__str-txt" [style.color]="strength.color">{{ strength.label }}</span>
  </div>

  <div class="pwgen__ctrl-grid">
    <div class="pwgen__ctrl-item">
      <div class="pwgen__ctrl-label">
        COMPRIMENTO <span>{{ options.length }}</span> caracteres
      </div>
      <input type="range" min="8" max="64" step="1"
        [(ngModel)]="options.length" (input)="generate()">
    </div>
    <div class="pwgen__ctrl-item">
      <div class="pwgen__ctrl-label">
        QUANTIDADE <span>{{ options.quantity }}</span> senha(s)
      </div>
      <input type="range" min="1" max="5" step="1"
        [(ngModel)]="options.quantity" (input)="generate()">
    </div>
  </div>

  <div class="pwgen__ctrl-label pwgen__ctrl-label--alone">TIPOS DE CARACTERES</div>
  <div class="pwgen__toggles">
    <button class="pwgen__tog" [class.pwgen__tog--on]="options.upper" (click)="toggleOption('upper')">A–Z maiúsculas</button>
    <button class="pwgen__tog" [class.pwgen__tog--on]="options.lower" (click)="toggleOption('lower')">a–z minúsculas</button>
    <button class="pwgen__tog" [class.pwgen__tog--on]="options.num"   (click)="toggleOption('num')">0–9 números</button>
    <button class="pwgen__tog" [class.pwgen__tog--on]="options.sym"   (click)="toggleOption('sym')">!@#$ símbolos</button>
    <button class="pwgen__tog" [class.pwgen__tog--on]="options.noAmb" (click)="toggleOption('noAmb')">sem ambíguos (0 O l I)</button>
  </div>

  <div class="pwgen__toast">{{ toast }}</div>

  <div class="pwgen__tips">
    <div class="pwgen__tip" *ngFor="let tip of pwTips">
      <h4><i [class]="'ti ' + tip.icon" aria-hidden="true"></i>{{ tip.title }}</h4>
      <p>{{ tip.desc }}</p>
    </div>
  </div>
</div>
