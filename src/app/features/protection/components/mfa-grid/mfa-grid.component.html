<div class="mfa-grid">
  <div class="mfa-card" *ngFor="let card of cards">
    <h3 [style.color]="card.titleColor">
      <i [class]="'ti ' + card.icon" [style.color]="card.iconColor" aria-hidden="true"></i>
      {{ card.title }}
    </h3>
    <p>{{ card.description }}</p>
    <span class="mfa-card__rec" [ngClass]="'mfa-card__rec--' + card.recVariant">{{ card.recLabel }}</span>
  </div>
</div>
