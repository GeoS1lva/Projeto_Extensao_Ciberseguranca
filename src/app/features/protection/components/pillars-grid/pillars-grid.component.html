<div class="pillars-grid">
  <div class="pcard" *ngFor="let card of cards" [ngClass]="'pcard--' + card.variant">
    <div class="pcard__icon">
      <i [class]="'ti ' + card.icon" aria-hidden="true"></i>
    </div>
    <h3 class="pcard__title">{{ card.title }}</h3>
    <p class="pcard__desc">{{ card.description }}</p>
    <span class="pcard__tag">{{ card.tag }}</span>
  </div>
</div>
