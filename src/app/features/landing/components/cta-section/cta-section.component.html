<section class="cta-section">
  <div class="cta-section__glow" aria-hidden="true"></div>
  <h2 class="cta-section__title">
    Segurança não é opcional.<br>É <em>sobrevivência digital</em>.
  </h2>
  <p class="cta-section__sub">
    Receba atualizações sobre ameaças, vulnerabilidades e estratégias de defesa.
  </p>
  <div class="cta-section__box">
    <input
      class="cta-section__input"
      type="email"
      placeholder="seu@email.com"
      [(ngModel)]="email"
      aria-label="Endereço de e-mail" />
    <button class="cta-section__submit" (click)="onSubmit()">Acessar</button>
  </div>
</section>
