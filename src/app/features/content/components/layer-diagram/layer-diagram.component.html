<div class="layer-diagram">
  <div class="layer" *ngFor="let layer of layers" [ngClass]="layer.colorClass">
    <span class="layer__label">{{ layer.label }}</span>
    <div class="layer__content">
      <h4>{{ layer.title }}</h4>
      <p>{{ layer.description }}</p>
    </div>
    <i [class]="'ti ' + layer.icon + ' layer__icon'" aria-hidden="true"></i>
  </div>
</div>
