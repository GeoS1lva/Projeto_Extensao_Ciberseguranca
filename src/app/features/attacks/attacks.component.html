<div class="attacks-page grid-bg">
  <app-attacks-hero class="z-content"></app-attacks-hero>
  <app-impact-bar class="z-content"></app-impact-bar>
  <app-attack-nav
    class="z-content"
    [attacks]="attacks"
    [activeId]="activeId"
    (attackSelected)="onAttackSelected($event)">
  </app-attack-nav>
  <app-attack-panel class="z-content" [attack]="activeAttack"></app-attack-panel>
</div>
